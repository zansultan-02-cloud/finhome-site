name: Deploy to GitHub Pages
"on": {push: {branches: [main]}, workflow_dispatch: null}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: 20}}, {name: Install dependencies, working-directory: app, run: npm install}, {name: Build, working-directory: app, run: npm run build}, {name: Copy legacy static pages, run: "cp privacy.html app/dist/privacy.html && cp support.html app/dist/support.html && cp styles.css app/dist/styles.css"}, {uses: actions/upload-pages-artifact@v3, with: {path: app/dist}}]}, deploy: {needs: build, runs-on: ubuntu-latest, environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}, steps: [{uses: actions/deploy-pages@v4, id: deployment}]}}
